name: Mise à jour de la veille

on:
  schedule:
    - cron: "0 6 * * *"      # tous les jours à 6h (UTC)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main
  push:
    paths: ["data.js", "scripts/fetch-feeds.mjs"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fetch-feeds.mjs
      - name: Enregistrer veille.json s'il a changé
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add veille.json
          git diff --cached --quiet || (git commit -m "Mise à jour automatique de la veille" && git push)
