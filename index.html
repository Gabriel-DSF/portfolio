<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gabriel Da Silva – BTS SIO SISR</title>
    <meta
      name="description"
      content="Portfolio de Gabriel Da Silva, étudiant en BTS SIO option SISR en alternance chez Saint-Gobain : expérience, projets, veille technologique."
    />
    <meta name="theme-color" content="#06261a" />
    <link rel="icon" href="/src/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/src/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="data.js" defer></script>
    <script src="script.js" defer></script>
  </head>

  <body>
    <!-- Le menu est généré automatiquement à partir des sections ci-dessous -->
    <header class="nav">
      <a class="brand" id="brand" href="#top"></a>
      <nav id="menu" aria-label="Navigation principale"></nav>
    </header>

    <!--
      MODULES DU SITE
      - Chaque <section> est un module : son contenu vient de data.js.
      - Pour réorganiser : déplace une <section>. Pour en masquer une : supprime-la ou mets-la en commentaire.
      - data-render = nom du module, id = ancre du menu.
    -->
    <main id="top">
      <section class="hero" data-render="hero"></section>
      <section
        class="about"
        id="presentation"
        data-render="presentation"
      ></section>
      <section class="exp" id="experience" data-render="experience"></section>
      <section class="work" id="projets" data-render="projets"></section>
      <section class="veille" id="veille" data-render="veille"></section>
      <section class="contact" id="contact" data-render="contact"></section>
    </main>

    <footer class="footer" id="footer"></footer>

    <noscript
      ><p style="padding: 2rem; color: #fff">
        Ce site nécessite JavaScript pour afficher son contenu.
      </p></noscript
    >
  </body>
</html>
